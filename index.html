<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Water — Today</title>
<meta name="description" content="A friendly water tracker. Drink a glass, watch your buddy grow." />
<meta name="theme-color" content="#f6f9fd" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Water" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<style>
  :root{
    --bg:#f6f9fd;
    --card:#ffffff;
    --ink:#0f172a;
    --muted:#64748b;
    --faint:#94a3b8;
    --line:#e6ecf5;
    --blue:#2563eb;
    --blue-mid:#3b82f6;
    --blue-soft:#eaf2ff;
    --blue-ink:#1d4ed8;
    --track:#e6eefb;
    --cheek:#fb7185;
    --radius:22px;
    --shadow:0 10px 30px -18px rgba(30,64,175,.45);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1220;
      --card:#121c2d;
      --ink:#eaf1fb;
      --muted:#8fa3bf;
      --faint:#6b7f9c;
      --line:#1e2b40;
      --blue:#3b82f6;
      --blue-mid:#60a5fa;
      --blue-soft:#15243b;
      --blue-ink:#93c5fd;
      --track:#1b2942;
      --shadow:0 12px 32px -20px rgba(0,0,0,.9);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 28px);
  }
  .wrap{max-width:440px;margin:0 auto}

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-1px;flex:1}
  .chip-streak{
    display:inline-flex;align-items:center;gap:5px;background:#fff5e6;color:#b45309;
    border:1px solid #ffe4c2;font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:999px;
    white-space:nowrap;
  }
  @media (prefers-color-scheme: dark){
    .chip-streak{background:#2a1f10;color:#fbbf24;border-color:#3d2c15}
  }
  .icon-btn{
    width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);
    display:grid;place-items:center;color:var(--muted);flex:0 0 auto;
  }
  .icon-btn svg{width:19px;height:19px}
  .sub{margin:0 0 2px;font-size:13.5px;color:var(--muted)}

  /* ---------- install row ---------- */
  .install-row{
    display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:12px 14px;margin-top:14px;box-shadow:var(--shadow);
  }
  .install-row .txt{flex:1;min-width:0}
  .install-row strong{display:block;font-size:13.5px;font-weight:700}
  .install-row p{margin:2px 0 0;font-size:12px;color:var(--muted);line-height:1.45}
  .install-row .go{
    border:none;background:var(--blue);color:#fff;font-weight:700;font-size:13px;
    padding:10px 15px;border-radius:12px;flex:0 0 auto;
  }
  .share-ico{width:34px;height:34px;border-radius:10px;background:var(--blue-soft);color:var(--blue);
    display:grid;place-items:center;flex:0 0 auto}
  .share-ico svg{width:17px;height:17px}

  /* ---------- hero ---------- */
  .hero{position:relative;width:min(292px,80vw);aspect-ratio:1;margin:22px auto 4px}
  .ring{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
  .ring .trk{fill:none;stroke:var(--track);stroke-width:13}
  .ring .bar{
    fill:none;stroke:var(--blue);stroke-width:13;stroke-linecap:round;
    transition:stroke-dashoffset .8s cubic-bezier(.22,1,.36,1);
  }
  .pal{
    position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
  }
  .pal svg{width:47%;height:auto;transform-origin:50% 92%;
    transition:transform .6s cubic-bezier(.34,1.56,.64,1);}
  .hero.pop .pal svg{animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.1)}70%{transform:scale(.98)}100%{transform:scale(1)}}
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}96%,98%{transform:scaleY(.1)}}

  /* ---------- numbers ---------- */
  .fig{text-align:center;margin-top:10px;font-variant-numeric:tabular-nums}
  .fig .num{font-size:32px;font-weight:800;letter-spacing:-.8px}
  .fig .of{font-size:16px;color:var(--muted);font-weight:600}
  .statusline{
    display:flex;align-items:center;justify-content:center;gap:6px;
    margin-top:7px;font-size:14px;font-weight:700;color:var(--blue);
  }
  .statusline svg{width:15px;height:15px;flex:0 0 auto}

  /* ---------- buttons ---------- */
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;touch-action:manipulation}
  .add{
    display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    background:var(--blue);color:#fff;border-radius:18px;padding:17px;
    font-size:16px;font-weight:800;letter-spacing:-.2px;margin-top:22px;
    box-shadow:0 14px 26px -14px rgba(37,99,235,.65);
    transition:transform .1s ease,background .15s ease;
  }
  .add:active{transform:scale(.985)}
  .add .amt{font-weight:600;opacity:.85;font-size:14.5px}
  .quick{display:flex;gap:9px;margin-top:9px}
  .quick button{
    flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px 8px;font-size:14px;font-weight:700;color:var(--ink);
    box-shadow:var(--shadow);transition:transform .1s ease;
  }
  .quick button:active{transform:scale(.98)}
  .quick button:disabled{opacity:.45;box-shadow:none}
  .nextline{
    text-align:center;font-size:12.5px;color:var(--muted);margin-top:14px;
  }
  .nextline b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
  .nextline a{color:var(--blue);font-weight:700;text-decoration:none}

  /* ---------- week ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px 16px 14px;margin-top:18px}
  .card .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .card .hd h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
  .card .hd span{font-size:12px;color:var(--faint);font-weight:600}
  .bars{display:flex;gap:7px;align-items:flex-end}
  .day{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
  .day .tb{height:52px;width:100%;display:flex;align-items:flex-end}
  .day .b{width:100%;background:var(--track);border-radius:7px;transition:height .5s cubic-bezier(.34,1.4,.64,1)}
  .day.has .b{background:linear-gradient(180deg,var(--blue-mid),var(--blue))}
  .day .d{font-size:10.5px;color:var(--faint);font-weight:600}
  .day.cur .d{color:var(--blue)}

  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,14px);
    background:var(--ink);color:var(--bg);padding:12px 19px;border-radius:14px;
    font-size:13px;font-weight:700;opacity:0;pointer-events:none;
    transition:opacity .22s ease,transform .22s ease;z-index:60;max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .hidden{display:none !important}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>Today</h1>
    <span class="chip-streak hidden" id="streakChip">🔥 <span id="streakNum">0</span> day streak</span>
    <a class="icon-btn" href="settings.html" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 15.1 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.24.6.82 1 1.56 1.03H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1.03Z"/>
      </svg>
    </a>
  </header>
  <p class="sub" id="greeting">Let's get you hydrated</p>

  <!-- install: android gets a button, ios gets the share hint -->
  <div class="install-row hidden" id="installRow">
    <div class="share-ico" id="installIcon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/>
      </svg>
    </div>
    <div class="txt">
      <strong id="installTitle">Add to Home Screen</strong>
      <p id="installSub">Tap Share, then Add to Home Screen.</p>
    </div>
    <button class="go hidden" id="installBtn">Install</button>
  </div>

  <div class="hero" id="hero">
    <svg class="ring" viewBox="0 0 240 240" aria-hidden="true">
      <circle class="trk" cx="120" cy="120" r="104"/>
      <circle class="bar" id="ringBar" cx="120" cy="120" r="104"
              stroke-dasharray="653.45" stroke-dashoffset="653.45"/>
    </svg>

    <div class="pal">
      <svg viewBox="0 0 120 140" aria-hidden="true">
        <defs>
          <linearGradient id="dropGrad" x1="0.15" y1="0" x2="0.85" y2="1">
            <stop offset="0" stop-color="#a5d0ff"/>
            <stop offset="0.42" stop-color="#3b82f6"/>
            <stop offset="1" stop-color="#1d4ed8"/>
          </linearGradient>
        </defs>
        <path d="M60 6C60 6 104 56 104 92a44 44 0 0 1-88 0C16 56 60 6 60 6Z" fill="url(#dropGrad)"/>
        <ellipse cx="42" cy="62" rx="8.5" ry="17" transform="rotate(-20 42 62)" fill="#fff" opacity=".5"/>
        <ellipse class="eye" cx="47" cy="86" rx="5.4" ry="6.4" fill="#0b1220"/>
        <ellipse class="eye" cx="73" cy="86" rx="5.4" ry="6.4" fill="#0b1220"/>
        <circle cx="49" cy="83.5" r="1.9" fill="#fff"/>
        <circle cx="75" cy="83.5" r="1.9" fill="#fff"/>
        <ellipse cx="34" cy="99" rx="6" ry="4.2" fill="#fb7185" opacity=".5"/>
        <ellipse cx="86" cy="99" rx="6" ry="4.2" fill="#fb7185" opacity=".5"/>
        <path d="M52 100q8 7 16 0" fill="none" stroke="#0b1220" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div class="fig">
    <span class="num" id="mlNow">0</span>
    <span class="of"> of <span id="goalText">2,000</span> ml</span>
  </div>

  <div class="statusline" id="statusLine">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 2.6s6.6 7.3 6.6 11.9a6.6 6.6 0 1 1-13.2 0C5.4 9.9 12 2.6 12 2.6Z"/>
    </svg>
    <span id="statusText">Let's start with a glass</span>
  </div>

  <button class="add" id="addMain">Add a glass <span class="amt" id="mainAmount">250 ml</span></button>
  <div class="quick">
    <button data-add="100">100 ml</button>
    <button data-add="500">500 ml</button>
    <button id="undoBtn" disabled>Undo</button>
  </div>

  <p class="nextline" id="nextline">Reminders are off · <a href="settings.html">Turn on</a></p>

  <section class="card">
    <div class="hd"><h2>Last 7 days</h2><span id="weekAvg">—</span></div>
    <div class="bars" id="bars"></div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script>
(() => {
  "use strict";
  const C = window.WaterCore;
  const $ = (id) => document.getElementById(id);
  const RING = 2 * Math.PI * 104;

  let state = C.load();

  /* ---------- schedule + reminders ---------- */
  let timer = null;
  function armTimer() {
    clearTimeout(timer);
    const s = state.settings;
    if (!s.enabled || !s.nextAt) return;
    const delay = s.nextAt - Date.now();
    if (delay <= 0) { fireReminder(); return; }
    timer = setTimeout(fireReminder, Math.min(delay, 2147483647));
  }

  setInterval(() => {
    const s = state.settings;
    if (!s.enabled || !s.nextAt) return;
    if (Date.now() >= s.nextAt) fireReminder();
  }, 20000);

  function fireReminder() {
    if (!state.settings.enabled) return;
    const s = state.settings;
    const left = Math.max(0, s.goalMl - state.mlToday);
    const body = state.mlToday === 0
      ? "Pal's getting thirsty — time for a glass."
      : (left > 0 ? `${fmt(state.mlToday)} ml down, ${fmt(left)} ml to go today.`
                  : "Goal already done — a little extra never hurts.");
    notify("Drink some water", body);
    chime();
    if (s.vibrate && navigator.vibrate) navigator.vibrate([90, 60, 90]);
    C.scheduleNext(state, Date.now());
    armTimer();
    render();
  }

  async function notify(title, body) {
    const opts = {
      body,
      icon: "icons/icon-192.png",
      badge: "icons/badge-72.png",
      vibrate: state.settings.vibrate ? [90, 60, 90] : undefined,
      tag: "water-reminder",
      renotify: true,
      data: { url: "./?drank=1" },
      actions: [{ action: "drank", title: "Drank it" }, { action: "snooze", title: "Snooze 10 min" }]
    };
    try {
      if ("serviceWorker" in navigator) {
        const reg = await navigator.serviceWorker.ready;
        await reg.showNotification(title, opts);
        return;
      }
    } catch (e) { /* fall through */ }
    try {
      if (Notification.permission === "granted") new Notification(title, opts);
    } catch (e) { /* nothing else we can do */ }
  }

  let audioCtx = null;
  function chime() {
    if (!state.settings.sound) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const now = audioCtx.currentTime;
      [880, 1174].forEach((f, i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, now + i * 0.14);
        g.gain.exponentialRampToValueAtTime(0.11, now + i * 0.14 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.14 + 0.5);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now + i * 0.14); o.stop(now + i * 0.14 + 0.55);
      });
    } catch (e) { /* audio blocked, fine */ }
  }

  /* ---------- render ---------- */
  const fmt = (n) => Number(n).toLocaleString("en-IN");

  function statusFor(pct) {
    if (pct >= 1) return "Goal reached. Nice work!";
    if (pct >= 0.75) return "Almost there — keep going";
    if (pct > 0) return "Pal's getting there";
    return "Let's start with a glass";
  }

  function render() {
    const s = state.settings;
    const pct = s.goalMl ? Math.min(1, state.mlToday / s.goalMl) : 0;

    $("mlNow").textContent = fmt(state.mlToday);
    $("goalText").textContent = fmt(s.goalMl);
    $("statusText").textContent = statusFor(pct);
    $("mainAmount").textContent = s.glassMl + " ml";
    $("ringBar").setAttribute("stroke-dashoffset", (RING * (1 - pct)).toFixed(1));

    const streak = C.streak(state.history, s.goalMl);
    $("streakChip").classList.toggle("hidden", streak < 2);
    $("streakNum").textContent = streak;

    $("undoBtn").disabled = !state.lastAdd;

    // next reminder line
    const nl = $("nextline");
    if (s.enabled && s.nextAt) {
      const mins = Math.max(0, Math.round((s.nextAt - Date.now()) / 60000));
      nl.innerHTML = mins <= 0
        ? "Reminder due now"
        : `Next reminder <b>${C.fmtClock(s.nextAt)}</b> · in ${mins} min`;
    } else {
      nl.innerHTML = `Reminders are off · <a href="settings.html">Turn on</a>`;
    }

    renderWeek();
  }

  function renderWeek() {
    const days = C.week(state.history, state.settings.goalMl);
    const max = Math.max(state.settings.goalMl, ...days.map(d => d.ml), 1);
    const H = 52;
    $("bars").innerHTML = days.map(d => {
      const h = d.ml > 0 ? Math.max(6, Math.round((d.ml / max) * H)) : 3;
      return `<div class="day ${d.cur ? "cur" : ""} ${d.ml > 0 ? "has" : ""}" title="${fmt(d.ml)} ml">
        <div class="tb"><div class="b" style="height:${h}px"></div></div>
        <div class="d">${d.label}</div>
      </div>`;
    }).join("");
    const done = days.filter(d => d.ml > 0);
    $("weekAvg").textContent = done.length
      ? fmt(Math.round(done.reduce((a, d) => a + d.ml, 0) / done.length)) + " ml avg"
      : "—";
  }

  function pop() {
    const h = $("hero");
    h.classList.remove("pop");
    void h.offsetWidth;
    h.classList.add("pop");
    clearTimeout(pop._t);
    pop._t = setTimeout(() => h.classList.remove("pop"), 600);
  }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("show"), 1900);
  }

  /* ---------- actions ---------- */
  function addWater(ml) {
    if (!ml) return;
    state.lastAdd = { ml, at: Date.now() };
    C.setToday(state, state.mlToday + ml);
    pop();
    if (state.settings.vibrate && navigator.vibrate) navigator.vibrate(16);
    toast(`+${ml} ml`);
    render();
  }

  $("addMain").addEventListener("click", () => addWater(state.settings.glassMl));
  document.querySelectorAll("[data-add]").forEach(b =>
    b.addEventListener("click", () => addWater(Number(b.dataset.add))));

  $("undoBtn").addEventListener("click", () => {
    if (!state.lastAdd) return;
    C.setToday(state, state.mlToday - state.lastAdd.ml);
    state.lastAdd = null;
    C.save(state);
    render();
    toast("Last entry removed");
  });

  /* ---------- install ---------- */
  let deferredPrompt = null;
  const isStandalone = () =>
    window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    showInstall("android");
  });

  function showInstall(kind) {
    if (isStandalone()) return;
    const row = $("installRow");
    row.classList.remove("hidden");
    if (kind === "android" && deferredPrompt) {
      $("installTitle").textContent = "Install the app";
      $("installSub").textContent = "Add it to your home screen — one tap.";
      $("installBtn").classList.remove("hidden");
    } else if (kind === "menu") {
      $("installTitle").textContent = "Install as an app";
      $("installSub").textContent = "Open your browser menu, then “Install app” or “Add to Home screen”.";
      $("installBtn").classList.add("hidden");
    }
  }

  $("installBtn").addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    if (outcome === "accepted") {
      $("installRow").classList.add("hidden");
      toast("Installed");
    }
  });

  function setupInstall() {
    if (isStandalone()) { $("installRow").classList.add("hidden"); return; }
    if (isIOS()) {
      $("installRow").classList.remove("hidden");
      $("installTitle").textContent = "Add to Home Screen";
      $("installSub").textContent = "Tap the Share button, then “Add to Home Screen”.";
      $("installBtn").classList.add("hidden");
    } else {
      // Android/desktop: the button appears as soon as Chrome offers the prompt
      setTimeout(() => { if (!deferredPrompt) showInstall("menu"); }, 2000);
    }
  }

  /* ---------- service worker ---------- */
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(() => {});
    navigator.serviceWorker.addEventListener("message", (ev) => {
      const d = ev.data || {};
      if (d.type === "drank") addWater(state.settings.glassMl);
      if (d.type === "snoozed") {
        state.settings.nextAt = Date.now() + 10 * 60000;
        C.save(state); armTimer(); render();
        toast("Snoozed 10 minutes");
      }
    });
  }

  /* ---------- boot ---------- */
  function boot() {
    const params = new URLSearchParams(location.search);
    if (params.get("drank") === "1") {
      addWater(state.settings.glassMl);
      history.replaceState({}, "", location.pathname);
    }

    const key = C.todayKey();
    if (state.history[key] === undefined) { state.history[key] = state.mlToday; C.save(state); }

    const s = state.settings;
    if (s.enabled && s.nextAt && Date.now() - s.nextAt > 60000) {
      C.scheduleNext(state, Date.now());
    }
    armTimer();
    render();
    setupInstall();

    const h = new Date().getHours();
    $("greeting").textContent = h < 12 ? "Good morning — start with a glass"
      : h < 17 ? "Good afternoon — keep it going"
      : "Good evening — top up before bed";

    // refresh the countdown + reload state when coming back from settings
    setInterval(render, 20000);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      state = C.load();
      render();
      armTimer();
    });
    window.addEventListener("focus", () => { state = C.load(); render(); });
  }

  boot();
})();
</script>
</body>
</html>
